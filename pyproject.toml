[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wormpimc"
version = "0.11.0"
description = "Readable reference implementation of continuous-space Worm PIMC"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Worm PIMC project contributors" },
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
test = [
    "pytest>=8",
]
notebook = [
    "matplotlib>=3.8",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5",
    "nbclient>=0.10",
]

[project.scripts]
wormpimc = "wormpimc.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wormpimc = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
